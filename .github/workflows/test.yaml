name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      # Pure-Python unit tests (no simulator). test/test_volume_curve.py holds
      # pytest tests over the AMP table (FR-023). `make` cannot run them --
      # they are pytest tests, not cocotb tests, so cocotb discovers nothing in
      # that module and still exits 0. Without this step they run nowhere in
      # CI. Deliberately before the cocotb suite: it takes ~0.02s, so an
      # AMP-table regression fails in seconds rather than after ~40 minutes.
      - name: Run pure-Python unit tests
        shell: bash
        run: |
          cd test
          python -m pytest test_volume_curve.py -v

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
